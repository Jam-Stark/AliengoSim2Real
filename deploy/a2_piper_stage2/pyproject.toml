[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2-piper-stage2-deploy"
version = "0.1.0"
description = "External-host Stage2 dual-policy runtime for A2 and PiPER"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.0",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
policy = ["torch==2.7.0"]

[project.scripts]
a2-piper-stage2 = "a2_piper_stage2_deploy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
